[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "market-monitor"
version = "0.1.0"
description = "Lightweight stock/ETF/crypto monitor with Telegram alerts for Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
]

[project.scripts]
market-monitor = "market_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"market_monitor.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
