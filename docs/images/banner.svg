<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Market Monitor</title>
  <desc id="desc">Stock, ETF and crypto price alerts on Telegram, from a Raspberry Pi</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <path d="M720 60H1220M720 120H1220M720 180H1220M720 240H1220"/>
  </g>
  <!-- price line -->
  <path d="M720 230 L770 215 L810 222 L850 190 L890 198 L930 160 L970 172 L1010 130 L1050 142 L1090 104 L1130 116 L1170 84 L1220 70 L1220 270 L720 270 Z" fill="url(#area)"/>
  <path d="M720 230 L770 215 L810 222 L850 190 L890 198 L930 160 L970 172 L1010 130 L1050 142 L1090 104 L1130 116 L1170 84 L1220 70" fill="none" stroke="#22c55e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- threshold -->
  <path d="M720 120H1220" stroke="#facc15" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="1090" cy="104" r="8" fill="#facc15"/>
  <!-- alert bubble -->
  <g transform="translate(940 36)">
    <rect width="190" height="44" rx="12" fill="#ffffff"/>
    <text x="16" y="29" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">▲ ENI.MI  +3.1%</text>
  </g>
  <!-- text -->
  <text x="64" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Market Monitor</text>
  <text x="66" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Stock, ETF &amp; crypto price alerts on Telegram</text>
  <text x="66" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">from a Raspberry Pi, with free data sources.</text>
</svg>
